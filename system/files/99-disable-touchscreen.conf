# Disables the built-in ELAN901C finger touchscreen, installed by
# dotfiles-touchscreen.
#
# MatchIsTouchscreen narrows this to the touch device only, so the pen/stylus
# digitizer on the same panel keeps working.  The number is high so this loads
# after the default 40-libinput.conf that would otherwise claim the device.
Section "InputClass"
    Identifier "disable touchscreen"
    MatchProduct "ELAN901C:00 04F3:2EDA"
    MatchIsTouchscreen "on"
    Option "Ignore" "on"
EndSection
